[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bytes = "1"
hashbrown = "0.15"
memchr = "2"
memmap2 = "0.9"
parquet = { version = "53.4", default-features = false }
rayon = "1.10"
rustc-hash = "2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
